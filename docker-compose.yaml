version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: mawaddadb-container
    environment:
     POSTGRES_DB: mawaddadb
     POSTGRES_USER: mawadda
     POSTGRES_PASSWORD: Ma19072006@
    ports:
      - "5432:5432"
    networks:
      - pg-network
    volumes:
      - pg-data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pg-admin
    environment:
      PGADMIN_DEFAULT_EMAIL: alkhorchanimawadda@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Ma19072006@
    ports:
      - "8080:80"
    networks:
      - pg-network

networks:
  pg-network:

volumes:
  pg-data: